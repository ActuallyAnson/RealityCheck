name: ci
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build (plain C++17, no third-party dependencies)
        run: cmake -S . -B build && cmake --build build -j 4
      - name: Unit and end-to-end tests
        run: ./build/rc_tests
      - name: rc_scan smoke test (a stranger's first command)
        run: sh scripts/scan_selftest.sh build
      - name: Regenerate every results table from the saved runs (no API calls) and compare with the committed tables
        if: runner.os == 'macOS'   # the tables were produced on macOS; Linux libm differences can change replayed attribution
        run: sh scripts/reproduce.sh build
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with AddressSanitizer and UBSan (UBSan aborts on any finding)
        run: cmake -S . -B build_san -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -O1" && cmake --build build_san -j 4 --target rc_tests rc_fuzz
      - name: Tests under sanitizers
        run: ASAN_OPTIONS=detect_leaks=0 ./build_san/rc_tests
      - name: Fuzz the parsers and the API
        run: ASAN_OPTIONS=detect_leaks=0 ./build_san/rc_fuzz --iterations 100000 --api-iterations 500 --seed 1
  linux-evaluation:
    # Re-runs the model-free evaluations on Linux and reports how they differ from the macOS-produced tables. Informational: libm differences make some
    # traces differ across platforms (docs/ROBUSTNESS.md), so a difference is a finding to read, not a failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build && cmake --build build -j 4 --target rc_eval rc_redteam rc_corpus rc_tests rc_strictcheck
      - name: Validator red team (deterministic; fails if a contradicting forgery is accepted)
        run: ./build/rc_redteam --per-bug 3 | tee redteam.md
      - name: External-scenario corpus
        run: ./build/rc_corpus | tee corpus.txt
      - name: Random baselines on Linux against the committed (macOS) tables
        run: |
          mkdir -p linux_results
          for spec in "orbit data/eval_lock_orbit.json results/orbit" "cartpole data/eval_lock_cartpole.json results/cartpole" "traffic data/eval_lock_traffic.json results/traffic" "ablation data/eval_lock_ablation.json results/ablation"; do
            set -- $spec
            ./build/rc_eval baseline --lock "$2" --out "linux_results/$1" > /dev/null
            if diff -q "linux_results/$1/baseline.md" "$3/baseline.md" > /dev/null; then echo "$1: identical to the committed macOS table" | tee -a linux_summary.txt
            else echo "$1: DIFFERS from the committed macOS table" | tee -a linux_summary.txt; diff "$3/baseline.md" "linux_results/$1/baseline.md" | head -20 | tee -a linux_summary.txt; fi
          done
      - name: Recorded reports on Linux (default and strict validator) against the committed macOS output
        run: |
          BUILD_DIR=build ./scripts/strictcheck.sh > /dev/null
          if git diff --quiet -- results/validator/strict.txt; then echo "strict validator: identical to the committed macOS output" | tee -a linux_summary.txt
          else echo "strict validator: DIFFERS from the committed macOS output" | tee -a linux_summary.txt; git diff -- results/validator/strict.txt | head -40 | tee -a linux_summary.txt; fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-evaluation
          path: |
            linux_summary.txt
            linux_results
            redteam.md
            corpus.txt
